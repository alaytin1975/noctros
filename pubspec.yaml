name: noctros
description: Noctros — a voice-first AI operating system for smartphones.
publish_to: "none"
version: 0.8.1+9

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  android_intent_plus: ^5.3.0
  battery_plus: ^6.2.1
  crypto: ^3.0.6
  dio: ^5.8.0+1
  encrypt: ^5.0.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.2
  geolocator: ^13.0.4
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  http_parser: ^4.1.2
  intl: ^0.20.2
  markdown: ^7.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  record: ^6.0.0
  share_plus: ^10.1.4
  speech_to_text: ^7.0.0
  sqflite: ^2.4.2
  torch_light: ^1.1.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  web_socket_channel: ^3.0.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env.example
