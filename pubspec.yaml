name: noctros
description: Noctros — a voice-first AI operating system for smartphones.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.2

  # Persistence
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2

  # Security
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3

  # Models
  uuid: ^4.5.1

  # Voice & device
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  permission_handler: ^11.4.0
  geolocator: ^13.0.4

  # UI
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
